name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack halo-chat.zip
        run: |
          test -f halo-chat.zip || { echo "halo-chat.zip is missing from the repository root"; exit 1; }
          unzip -q halo-chat.zip -d project
          ls project/halo-chat

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages and sync web files into Android
        working-directory: project/halo-chat
        run: |
          npm ci
          npm run build:web
          npx cap sync android

      - name: Build debug APK
        working-directory: project/halo-chat/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: halo-debug-apk
          path: project/halo-chat/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Halo APK ${{ github.run_number }}
          files: project/halo-chat/android/app/build/outputs/apk/debug/app-debug.apk
